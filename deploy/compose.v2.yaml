name: mindspeed-config-mcp-v2

services:
  mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      platforms:
        - linux/amd64
      labels:
        org.opencontainers.image.revision: ${MCP_V2_COMMIT:?Set MCP_V2_COMMIT to the pushed commit}
    image: mindspeed-config-mcp-v2:latest
    container_name: mindspeed-config-mcp-v2
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "3000"
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-42.192.111.92,127.0.0.1,localhost}
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:?Set a token of at least 32 characters in deploy/.env.v2}
      MCP_BROWSER_ACCESS_TOKEN: ${MCP_BROWSER_ACCESS_TOKEN:-}
      MCP_BROWSER_BASE_PATH: /mindspeed-config-v2
      MCP_BROWSER_PUBLIC_ORIGIN: ${MCP_BROWSER_PUBLIC_ORIGIN:-https://42.192.111.92}
    ports:
      - "127.0.0.1:3003:3000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    cpus: 1.0
    mem_limit: 1g
    memswap_limit: 1g
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
