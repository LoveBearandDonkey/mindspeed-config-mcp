name: mindspeed-config-mcp

services:
  mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      platforms:
        - linux/amd64
    image: mindspeed-config-mcp:0.1.0
    container_name: mindspeed-config-mcp
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "3000"
      MCP_ALLOWED_HOSTS: 127.0.0.1,localhost
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:?请在deploy/.env中设置至少32字符的随机Token}
    ports:
      - "127.0.0.1:${MCP_HOST_PORT:-3002}:3000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    cpus: 1.0
    mem_limit: 1g
    memswap_limit: 1g
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
